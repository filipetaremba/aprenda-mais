name: aprova_mais
description: Aprova+ — preparação offline para os exames de admissão às universidades em Moçambique.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.6.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Conteúdo grátis embutido (gerado por: cd backend; npm run exportar:app)
  assets:
    - assets/content/
    - assets/content/imagens/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# Ícone da app (fonte: assets/icon/*.svg). Para regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3B7BEA"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
